[project]
name = "devcockpit"
version = "0.1.0"
description = "Central local de gerenciamento dos projetos de desenvolvimento"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Piso em 2.0 de propósito, não em 2.1: a suíte inteira (970 testes)
    # passou com 2.1.4 em 2026-10-10, e nada aqui usa API exclusiva de
    # 2.1 — apertar o piso só excluiria quem está em 2.0 sem ganho.
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # Descoberta de porta: é a única forma portável de ir do PID ao diretório
    # de trabalho do processo, que é o que permite dizer de qual projeto a
    # porta é. O caminho por CLI (netstat/Get-NetTCPConnection) custava 1,4 s
    # nesta máquina contra 5 ms aqui, e não dava o `cwd`.
    "psutil>=6.0",
]

[project.scripts]
devcockpit = "app.launcher:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
# Só para gerar o executável (scripts/build_exe.ps1). Fora do grupo `dev`
# porque nada da rotina de desenvolvimento depende dele.
build = [
    "pyinstaller>=6.10",
    # Janela nativa (WebView2) e geracao do icone do aplicativo.
    "pywebview>=5.0",
    "pillow>=10.0",
]

[build-system]
# >=77: PEP 639 (`license` como expressão SPDX + `license-files`). Abaixo disso
# o build falha em vez de ignorar a licença declarada.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: teste unitário, sem tocar no sistema operacional",
    "integration: usa processo ou filesystem real, em diretório temporário",
    "api: teste de contrato HTTP",
    "integration_git: usa git real em repositório temporário",
    "integration_docker: exige Docker; desativado por padrão",
    "slow: demorado",
]
addopts = "-m 'not integration_docker and not slow' --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = ["app/adapters/github/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# B008: `Depends(...)` em default de argumento é o idioma do FastAPI,
# não o bug de default mutável que a regra procura.
[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
