<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevCockpit</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/hyperbrain.css">
  <script>
    // Aplica o tema antes do primeiro paint: carregar no módulo faria a tela
    // piscar em escuro antes de virar clara.
    try {
      var pref = window.localStorage.getItem('devcockpit:theme') || 'system';
      var claro = pref === 'light'
        || (pref === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.dataset.theme = claro ? 'light' : 'dark';
      document.documentElement.dataset.themePreference = pref;
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
</head>
<body>
  <div class="app-shell" data-sidebar="expanded" data-rail="shown">
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo" aria-hidden="true">◈</span>
        <span class="sidebar__title">DevCockpit</span>
        <button
          id="sidebar-toggle"
          class="sidebar__collapse"
          type="button"
          aria-controls="sidebar-nav"
          aria-label="Recolher a barra lateral"
          title="Recolher a barra lateral (Ctrl+B)"></button>
      </div>

      <nav id="sidebar-nav" class="sidebar__nav" aria-label="Navegação principal">
        <a class="nav-item" href="#/day" data-route="day" data-icon="pulse">
          <span class="nav-item__label">Meu dia</span>
        </a>
        <a class="nav-item" href="#/dashboard" data-route="dashboard" data-icon="grid">
          <span class="nav-item__label">Dashboard</span>
        </a>
        <a class="nav-item" href="#/projects" data-route="projects" data-icon="layers">
          <span class="nav-item__label">Projects</span>
        </a>
        <a class="nav-item" href="#/hyperbrain" data-route="hyperbrain" data-icon="graph">
          <span class="nav-item__label">HyperBrain</span>
        </a>
        <a class="nav-item" href="#/ports" data-route="ports" data-icon="plug">
          <span class="nav-item__label">Ports</span>
        </a>
        <a class="nav-item" href="#/activity" data-route="activity" data-icon="pulse">
          <span class="nav-item__label">Activity</span>
        </a>
        <a class="nav-item" href="#/settings" data-route="settings" data-icon="gear">
          <span class="nav-item__label">Settings</span>
        </a>
      </nav>

      <div class="sidebar__section">
        <h2 class="sidebar__heading">Fixados</h2>
        <div id="pinned-list" class="sidebar__pinned"></div>
      </div>

      <div class="sidebar__footer">
        <span id="tools-indicator" class="tools-indicator"></span>
      </div>
    </aside>

    <aside id="project-rail" class="rail" aria-label="Projetos ativos"></aside>

    <div class="main">
      <header class="topbar">
        <input
          id="global-search"
          class="topbar__search"
          type="search"
          placeholder="Buscar e filtrar projetos…  (Ctrl+K)"
          aria-label="Buscar projeto">
        <div id="freshness" class="topbar__meta"></div>
        <button
          id="rail-toggle"
          class="rail-switch"
          type="button"
          aria-controls="project-rail"
          aria-pressed="true"
          aria-label="Ocultar os projetos ativos"></button>
        <button
          id="quick-ask"
          class="topbar__tool"
          type="button"
          aria-label="Pergunta rápida"
          title="Pergunta rápida (Ctrl+Espaço)"></button>
        <button
          id="open-editor"
          class="topbar__tool"
          type="button"
          aria-label="Abrir o VS Code"
          title="Abrir o VS Code"></button>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Alternar tema"></button>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
